<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Switcher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="page">
    <div class="card">
        <h1>Mood Switcher</h1>
        <p id="message">Choose a mood:</p>
        <button id="happy" onclick="happy()">Happy</button>
        <button id="sad" onclick="sad()">Sad</button>
        <button id="jealous" onclick="jealous()">Jealous</button>
        <button id="angry" onclick="angry()">Angry</button>
        <button id="anxious" onclick="anxious()">Anxious</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
